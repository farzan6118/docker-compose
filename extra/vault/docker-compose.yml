services:
  vault:
    container_name: vault
    image: hashicorp/vault:2.2.0
    ports:
      - "8200:8200"
    restart: unless-stopped
    volumes:
      - vault_data:/vault/data
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
    networks:
      - shared_network
    command: vault server -config=/vault/config/vault.hcl

volumes:
  vault_data:

networks:
  shared_network:
    external: true
    name: shared_network
