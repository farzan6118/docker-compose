services:
  vault:
    container_name: vault
    image: hashicorp/vault:2.2.0
    ports:
      - "8200:8200"
    restart: unless-stopped
    # Docker-created named volumes are root-owned; run as root so file storage is writable.
    user: "0:0"
    environment:
      # The image attempts to set IPC_LOCK capability; local Docker Desktop may lack setcap.
      SKIP_SETCAP: "1"
    volumes:
      - vault_data:/vault/file
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
    networks:
      - shared_network
    command: vault server -config=/vault/config/vault.hcl

volumes:
  vault_data:

networks:
  shared_network:
    external: true
    name: shared_network
