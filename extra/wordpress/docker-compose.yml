services:
  wordpress:
    container_name: wordpress_app
    image: wordpress:7.1.3-php8.5-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: user
      WORDPRESS_DB_PASSWORD: pass
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - ./wordpress_data:/var/www/html
    networks:
      - shared_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  wordpress_data:

networks:
  shared_network:
    external: true
    name: shared_network