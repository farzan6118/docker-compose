services:
  redis:
    container_name: redis
    image: redis:8.8.0-alpine3.23

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]

    networks:
      - redis_shared_network

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "user", "-a", "pass", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis_data:

networks:
  redis_shared_network:
    name: redis_shared_network
    driver: bridge
